<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Asisten Agung - PPLG Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Warna Dasar & Font */
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Mencegah scroll di seluruh body */
        }

        /* Header MSI */
        .chat-header {
            text-align: center;
            margin-bottom: 10px;
            font-family: 'Oxanium', sans-serif;
            padding: 10px;
            width: 100%;
        }

        .m-title {
            font-size: clamp(18px, 5vw, 24px);
            /* Ukuran font fleksibel buat HP */
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
        }

        .thin-15 {
            color: #ef4444;
            font-weight: 600;
        }

        .tech-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            margin: 5px auto;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }

        /* Container Chat - Responsif HP */
        .chat-container {
            width: 95%;
            max-width: 600px;
            height: 80vh;
            /* Tinggi disesuaikan biar gak kepotong keyboard HP */
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Box Chat & Scrollbar Hidden */
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE/Edge */
        }

        #chat-box::-webkit-scrollbar {
            display: none;
            /* Chrome/Safari */
        }

        /* Bubble Chat */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(51, 65, 85, 0.5);
            border-left: 4px solid #ef4444;
            border-radius: 18px 18px 18px 4px;
        }

        /* Input Area */
        .input-area {
            padding: 15px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            outline: none;
            font-size: 16px;
            /* Mencegah auto-zoom di iPhone */
        }

        button {
            padding: 0 20px;
            background: #ef4444;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Style Code dalam Chat */
        pre {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #334155;
        }

        code {
            color: #facc15;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="chat-header">
        <span class="m-title">AI MSI <span class="thin-15">Thin 15</span></span>
        <div class="tech-line"></div>
    </div>

    <div class="chat-container">
        <div id="chat-box">
            <div class="message ai">Halo Agung! Aku asistenmu. Ada yang bisa dibantu hari ini?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Tanya sesuatu..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const pesan = inputField.value.trim();

            if (!pesan) return;

            appendMessage('user', pesan);
            inputField.value = '';

            try {
                // PAKAI LINK NGROK KAMU DISINI
                const response = await fetch('https://overlabor-fineness-strobe.ngrok-free.dev/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pesan: pesan })
                });

                const data = await response.json();

                if (data.jawaban_ai) {
                    appendMessage('ai', data.jawaban_ai);
                } else {
                    appendMessage('ai', "Waduh, AI-nya lagi bengong. Coba lagi, Gung!");
                }
            } catch (error) {
                appendMessage('ai', "<span style='color: #ef4444;'>Gagal terhubung ke server. Pastikan Ngrok & Uvicorn jalan!</span>");
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.classList.add('message', sender);
            chatBox.appendChild(div);

            if (sender === 'ai') {
                let i = 0;
                div.innerHTML = "";
                function typeWriter() {
                    if (i < text.length) {
                        div.innerHTML = marked.parse(text.substring(0, i + 1));
                        i++;
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(typeWriter, 15);
                    }
                }
                typeWriter();
            } else {
                div.innerText = text;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>

</html>
